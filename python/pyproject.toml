[project]
name = "valor"
version = "0.1.0"
description = "Valor - personal professional financial assistant"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later WITH GPL-3.0-NonCommercial" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "httpx>=0.27",
    "anyio>=4.4",
    "akshare>=1.13",
    "tushare>=1.4",
    "baostock>=0.8.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "pillow>=12.3.0",
    "sqlite-vec>=0.1.6",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "jieba>=0.42",
    "sentence-transformers>=3.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "vcrpy>=6.0",
    "ruff>=0.5",
]

[project.scripts]
valor = "valor.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "langchain-openai>=1.3.5",
    "ragas>=0.4.3",
]
